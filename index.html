<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playerlion</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}
.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 10px #0001;
}
button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}
.start{
    background:#16a34a;
    color:white;
}
.menu{
    background:#e5e7eb;
}
.section{
    display:none;
}
.section.active{
    display:block;
}
.status{
    text-align:center;
    font-weight:bold;
    padding:10px;
}
.back{
    background:#374151;
    color:white;
}
</style>
</head>

<body>

<header>
    <h1>🐾 Playerlion</h1>
    <p>لوحة تحكم</p>
</header>

<div class="container">

<div id="home" class="section active">
    <div class="card">
        <h2>مرحباً بك 👋</h2>
        <div id="status" class="status">🔴 متوقف</div>
        <button class="start" onclick="startBot()">🟢 ابدأ البوت</button>
    </div>

    <div class="card">
        <button class="menu" onclick="show('games')">🎮 الألعاب</button>
        <button class="menu" onclick="show('services')">🛠️ الخدمات</button>
        <button class="menu" onclick="show('users')">👥 المستخدمون</button>
        <button class="menu" onclick="show('stats')">📊 الإحصائيات</button>
        <button class="menu" onclick="show('settings')">⚙️ الإعدادات</button>
        <button class="menu" onclick="show('about')">ℹ️ حول Playerlion</button>
    </div>
</div>

<div id="games" class="section">
    <div class="card">
        <h2>🎮 الألعاب</h2>
        <p>قسم الألعاب جاهز للإضافة.</p>
        <button onclick="alert('سيتم إضافة الألعاب هنا لاحقاً')">إضافة لعبة</button>
        <button class="back" onclick="home()">رجوع</button>
    </div>
</div>

<div id="services" class="section">
    <div class="card">
        <h2>🛠️ الخدمات</h2>
        <p>قسم الخدمات جاهز.</p>
        <button onclick="alert('الخدمات ستكون متاحة بعد ربط البوت')">عرض الخدمات</button>
        <button class="back" onclick="home()">رجوع</button>
    </div>
</div>

<div id="users" class="section">
    <div class="card">
