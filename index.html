<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playerlion</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: white;
      padding: 30px 20px;
      text-align: center;
    }

    .lion {
      font-size: 70px;
      margin-top: 40px;
    }

    h1 {
      margin: 10px 0;
      font-size: 32px;
    }

    .welcome {
      color: #666;
      margin-bottom: 30px;
    }

    .button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      background: #eeeeee;
    }

    .button:active {
      transform: scale(0.98);
    }

    .service {
      background: #f4f6f8;
      border-radius: 14px;
      padding: 18px;
      margin: 12px 0;
      font-size: 18px;
    }

    .back {
      background: #222;
      color: white;
      margin-top: 20px;
    }

    .footer {
      margin-top: 35px;
      color: #999;
      font-size: 13px;
    }

    .page {
      display: none;
    }

    .active {
      display: block;
    }
  </style>
</head>

<body>

  <div class="app">

    <div id="home" class="page active">

      <div class="lion">🦁</div>

      <h1>Playerlion</h1>

      <p class="welcome">
        مرحباً بك في تطبيق البوت
      </p>

      <button class="button" onclick="showPage('home')">
        🏠 الرئيسية
      </button>

      <button class="button" onclick="showPage('services')">
        📋 الخدمات
      </button>

      <button class="button" onclick="showPage('settings')">
        ⚙️ الإعدادات
      </button>

    </div>

    <div id="services" class="page">

      <div class="lion">🦁</div>

      <h1>الخدمات</h1>

      <p class="welcome">
        اختر الخدمة التي تريدها
      </p>

      <div class="service">
        🔎 خدمة البحث
      </div>

      <div class="service">
        🛡️ فحص الحسابات
      </div>

      <div class="service">
        📢 التبليغ
      </div>

      <div class="service">
        ℹ️ معلومات البوت
      </div>

      <button class="button back" onclick="showPage('home')">
        🔙 رجوع
      </button>

    </div>

    <div id="settings" class="page">

      <div class="lion">🦁</div>

      <h1>الإعدادات</h1>

      <p class="welcome">
        سيتم تنظيم الإعدادات لاحقاً
      </p>

      <button class="button back" onclick="showPage('home')">
        🔙 رجوع
      </button>

    </div>

    <p class="footer">
      Playerlion © 2026
    </p>

  </div>

  <script>
    function showPage(page) {
      document.getElementById("home").classList.remove("active");
      document.getElementById("services").classList.remove("active");
      document.getElementById("settings").classList.remove("active");

      document.getElementById(page).classList.add("active");
    }
  </script>

</body>
</html>
